name: Daily Ingestion & Feature Pipeline

on:
  schedule:
    - cron: '30 14 * * *' # Runs daily at 14:30 UTC (after Nord Pool publishes data)
  workflow_dispatch: # Allows manual runs from GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies with uv
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run raw data ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_AREA: SE2
        run: python daily_run.py

      - name: Run feature pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_AREA: SE2
        run: python feature_pipeline.py