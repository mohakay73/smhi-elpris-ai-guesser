<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swedish Electricity Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .price-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .price {
            font-size: 2.5rem;
            color: #2980b9;
            font-weight: bold;
            margin: 0;
        }
        .unit {
            font-size: 1rem;
            color: #7f8c8d;
        }
        .meta {
            font-size: 0.85rem;
            color: #95a5a6;
        }
        .loading {
            color: #e67e22;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ Electricity Price Predictor</h1>
        <div class="subtitle" id="area-title">Price Area: SE3</div>
        
        <div class="price-box">
            <p class="price" id="price-output"><span class="loading">Loading...</span></p>
            <span class="unit">SEK / kWh</span>
        </div>
        
        <div class="meta" id="date-output">Fetching forecast data...</div>
    </div>

    <script>
        // Replace with your actual live Render backend URL
        const apiUrl = 'https://smhi-elpris-ai-guesser.onrender.com/predict';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('area-title').innerText = `Price Area: ${data.price_area}`;
                document.getElementById('price-output').innerText = data.predicted_price_sek_per_kwh.toFixed(2);
                document.getElementById('date-output').innerText = `Target Forecast Date: ${data.target_date.split('T')[0]}`;
            })
            .catch(error => {
                console.error('Error fetching prediction:', error);
                document.getElementById('price-output').innerText = "Error";
                document.getElementById('date-output').innerText = "Could not connect to backend API.";
            });
    </script>
</body>
</html>
