[project]
name = "elpris-projekt"
version = "0.1.0"
description = "Startrepo, Data engineering och Agila metoder (YH-02032)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "matplotlib>=3.8",
    "duckdb>=1.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# Behövs för att köra notebooken.
notebook = ["jupyter>=1.0", "ipykernel>=6.29"]
# Från vecka 5, för modellregistret.
hub = ["huggingface-hub>=0.24"]
# Från vecka 6, om ni väljer att bygga inferenstjänsten här i repot.
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# CI: lint och test.
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.uv.workspace]
members = [
    "exercises/ingestion",
]
